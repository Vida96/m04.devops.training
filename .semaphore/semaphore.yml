version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Docker
    dependencies: []
    task:
      jobs:
        - name: Run Docker
          commands:
            - checkout
            - cd 2-docker-build
            - 'docker build -t myapp:${SEMAPHORE_GIT_SHA} .'
            - 'docker tag myapp:${SEMAPHORE_GIT_SHA} ${DOCKER_USERNAME}/myapp:${SEMAPHORE_WORKFLOW_ID}'
            - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
            - 'docker push ${DOCKER_USERNAME}/myapp:${SEMAPHORE_WORKFLOW_ID}'
      secrets:
        - name: DockerVida
