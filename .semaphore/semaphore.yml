version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Docker
    dependencies: []
    task:
      jobs:
        - name: Run Docker
          commands:
            - checkout
            - cd 2-docker-build
            - docker build -t myapp .
            - 'docker tag myapp $DOCKER_USERNAME/myapp:latest'
            - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
            - 'docker push $DOCKER_USERNAME/myapp:latest'
      secrets:
        - name: DockerVida
